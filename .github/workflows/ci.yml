name: CI — test, promoción a main y Release PR

# Dos ramas: dev es donde se trabaja, main es lo que reciben las instancias.
# main sólo avanza cuando los tests pasan, así que un commit rojo no puede
# llegarle a nadie. Ver ADR 0014 y 0015.
#
# Antes eran cuatro workflows sobre dev → stg → prod, y la promoción tenía dos
# eslabones manuales o condicionales en serie dentro del camino de distribución:
# había que mergear a mano un PR de release-please, y ese PR sólo se generaba si
# el token de la GitHub App estaba configurado. Resultado: prod, que es lo que
# recibe cualquiera que clona, quedó 11 commits atrás y CHANGELOG.md nunca
# existió.
#
# Acá la promoción no depende de ningún secreto opcional: main no está cubierta
# por el ruleset del repo, así que el GITHUB_TOKEN alcanza. Y no hay ningún
# `if: has_app` que la saltee en silencio — si el push falla, el job falla.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: shellcheck + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          find .claude/hooks -name '*.sh' -print0 | xargs -0 -r shellcheck -S warning
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pytest
        run: |
          pip install pytest
          pytest -q tests

  promote:
    name: Promover dev → main
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fast-forward puro: main queda idéntica a un commit de dev que pasó los
      # tests, sin commit de merge. Si no puede ser fast-forward, el push se
      # rechaza y el job falla — que es lo que queremos, porque significa que
      # alguien escribió en main por fuera de esta promoción.
      - name: Fast-forward main al commit testeado
        run: git push origin ${{ github.sha }}:refs/heads/main

  release-please:
    name: Release PR
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Apunta a dev, no a main: así el bump de versión y la entrada de
      # CHANGELOG.md viajan aguas abajo con el resto de los cambios. Apuntándolo
      # a main, sus commits quedarían sólo ahí y divergirían de dev.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
