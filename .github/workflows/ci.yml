name: CI

# Feedback continuo en dev: corre en cada push y PR a dev (incluye el
# Release PR de release-please). El gate duro antes de prod vive en
# release-please.yml (job `test`).

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  shellcheck:
    name: shellcheck (.claude/hooks/*.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: find .claude/hooks -name '*.sh' -print0 | xargs -0 -r shellcheck

  pytest:
    name: pytest (tests/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install pytest
      - name: Run tests
        run: pytest -q tests
