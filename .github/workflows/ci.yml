name: CI — test, promoción a main y Release PR

# Dos ramas: dev es donde se trabaja, main es lo que reciben las instancias.
# main sólo avanza cuando los tests pasan, así que un commit rojo no puede
# llegarle a nadie. Ver ADR 0014 y 0015.
#
# Antes eran cuatro workflows sobre dev → stg → prod, y la promoción tenía dos
# eslabones manuales o condicionales en serie dentro del camino de distribución:
# había que mergear a mano un PR de release-please, y ese PR sólo se generaba si
# el token de la GitHub App estaba configurado. Resultado: prod, que es lo que
# recibe cualquiera que clona, quedó 11 commits atrás y CHANGELOG.md nunca
# existió.
#
# Acá la promoción no depende de ningún secreto opcional: main no está cubierta
# por el ruleset del repo, así que el GITHUB_TOKEN alcanza. Y no hay ningún
# `if: has_app` que la saltee en silencio — si el push falla, el job falla.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: shellcheck + pytest
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 porque la auditoría de material sensible recorre el
      # historial completo. Con el clon superficial que trae el default, no
      # tendría nada que auditar y reportaría «limpio».
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          find .claude/hooks -name '*.sh' -print0 | xargs -0 -r shellcheck -S warning
          shellcheck -S warning .claude/hooks/git/pre-commit .claude/hooks/git/post-commit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pytest
        run: |
          pip install pytest
          pytest -q tests

      # Detecta una regresión en el gate y no meses después. Corre sobre HEAD y
      # no sobre --all a propósito: mientras el historial no esté purgado, --all
      # falla siempre por los 173 objetos que el PRD 1 viene a sacar, y un gate
      # que está rojo por algo conocido deja de ser una señal. Cuando la purga
      # se ejecute, esto pasa a --all. Ver issue #87.
      - name: Auditoría de material sensible
        run: |
          PYTHONPATH=.claude/skills/shared/scripts \
            python3 .claude/skills/shared/scripts/history_audit.py --rev 'HEAD^{tree}'

  promote:
    name: Promover dev → main
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 es obligatorio. Con la profundidad 1 por defecto, el
      # runner no tiene la ascendencia de main y `git push <sha>:refs/heads/main`
      # se rechaza con "fetch first" aunque el fast-forward sea posible: git no
      # puede probar la relación que el servidor exige.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fast-forward puro: main queda idéntica a un commit de dev que pasó los
      # tests, sin commit de merge. Si no puede ser fast-forward, el push se
      # rechaza y el job falla — que es lo que queremos, porque significa que
      # alguien escribió en main por fuera de esta promoción.
      - name: Fast-forward main al commit testeado
        run: git push origin ${{ github.sha }}:refs/heads/main

  release-please:
    name: Release PR
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Apunta a dev, no a main: así el bump de versión y la entrada de
      # CHANGELOG.md viajan aguas abajo con el resto de los cambios. Apuntándolo
      # a main, sus commits quedarían sólo ahí y divergirían de dev.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
