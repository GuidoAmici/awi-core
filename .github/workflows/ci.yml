name: CI — test y Release PR

# Una sola rama: main es donde se trabaja y lo que reciben las instancias.
# Un push directo a main llega a las instancias sin esperar a los tests: acá el
# job test avisa, no impide. Lo que tenga que probarse antes de llegarle a nadie
# va por PR. Ver ADR 0026.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: shellcheck + pytest
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 porque la auditoría de material sensible recorre el
      # historial completo. Con el clon superficial que trae el default, no
      # tendría nada que auditar y reportaría «limpio».
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          find .claude/hooks -name '*.sh' -print0 | xargs -0 -r shellcheck -S warning
          shellcheck -S warning .claude/hooks/git/pre-commit .claude/hooks/git/post-commit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pytest
        run: |
          # git-filter-repo hace falta porque tests/test_history_purge.py lo
          # ejercita de verdad (no lo mockea): sin esto en el PATH del runner,
          # el test falla con "git-filter-repo no está instalado" en vez de con
          # una señal real sobre la purga.
          pip install pytest git-filter-repo
          # El runner arranca sin identidad de git, y los tests de scaffold
          # crean repos y commitean en ellos. Sin esto fallan con "Author
          # identity unknown", que es ruido de entorno y no una señal sobre el
          # código. Representa una máquina de desarrollo normalmente configurada.
          git config --global user.email "ci@awi-core.local"
          git config --global user.name "AWI CI"
          pytest -q tests

      # Detecta una regresión en el gate y no meses después. Corre sobre HEAD y
      # no sobre --all a propósito: mientras el historial no esté purgado, --all
      # falla siempre por los 173 objetos que el PRD 1 viene a sacar, y un gate
      # que está rojo por algo conocido deja de ser una señal. Cuando la purga
      # se ejecute, esto pasa a --all. Ver issue #87.
      - name: Auditoría de material sensible
        run: |
          PYTHONPATH=.claude/skills/shared/scripts \
            python3 .claude/skills/shared/scripts/history_audit.py --rev 'HEAD^{tree}'

      # Las dos instancias de deriva que la revisión integral encontró se
      # encontraron por casualidad, al pasar por ahí para otra cosa. Esto existe
      # para que la próxima no dependa de la casualidad. Ver PRD 3 (issue #82).
      - name: Deriva de vocabulario
        run: |
          PYTHONPATH=.claude/skills/shared/scripts \
            python3 .claude/skills/shared/scripts/vocab_check.py --raiz .

  release-please:
    name: Release PR
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
