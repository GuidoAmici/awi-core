name: Release — promote stg to prod

# Se dispara cuando un humano mergea el Release PR en stg.
# release-please detecta el release → corre tests → si pasan, mergea
# stg → prod (gate de release).
#
# Nota: el automerge dev → stg de dev.yml usa GITHUB_TOKEN, que NO
# dispara este workflow (evita recursión); release-please ahí lo corre
# dev.yml. Este workflow solo actúa ante el merge humano del Release PR.

on:
  push:
    branches: [stg]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          target-branch: stg
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stg
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          find .claude/hooks -name '*.sh' -print0 | xargs -0 -r shellcheck -S warning
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pytest
        run: |
          pip install pytest
          pytest -q tests

  promote-to-prod:
    needs: [release-please, test]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 0
      - name: Merge stg into prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin stg:stg
          git merge --no-ff stg -m "ci: promote stg → prod (${{ needs.release-please.outputs.tag_name }})"
          git push origin prod
