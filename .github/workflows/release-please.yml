name: Release Please

# Gate de release para awi-core (modelo de 2 ramas: dev = trabajo, prod = publicado).
#
# Flujo:
#   1. Cada push a `dev` corre release-please, que mantiene un "Release PR"
#      (versión + CHANGELOG) calculado desde los conventional commits.
#   2. Aceptar (mergear) ese Release PR es el gate humano de release.
#   3. Al mergearse, corre `test`; si pasa, `promote` mergea dev → prod.
#      Los tests son el gate real antes de que algo llegue a prod.

on:
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          find .claude/hooks -name '*.sh' -print0 | xargs -0 -r shellcheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: pytest
        run: |
          pip install pytest
          pytest -q tests

  promote:
    needs: [release-please, test]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod
          fetch-depth: 0
      - name: Merge dev into prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev:dev
          git merge --no-ff dev -m "ci: promote dev → prod (${{ needs.release-please.outputs.tag_name }})"
          git push origin prod
